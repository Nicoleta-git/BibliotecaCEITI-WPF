name: .NET Core Desktop

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      Configuration: Release
      MySqlVersion: 8.0.46

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # self-contained so the machine does not need the .NET runtime installed
    - name: Publish the application
      run: dotnet publish BibliotecaCEITI/BibliotecaCEITI.csproj -c $env:Configuration -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/app

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: BibliotecaCEITI-Build
        path: dist/app

    # the steps below only run for a version tag, they take several minutes
    - name: Download portable MySQL
      if: startsWith(github.ref, 'refs/tags/')
      run: curl -L -o mysql.zip "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-$env:MySqlVersion-winx64.zip"

    - name: Extract MySQL
      if: startsWith(github.ref, 'refs/tags/')
      run: Expand-Archive -Path mysql.zip -DestinationPath mysql-extracted

    - name: Extract database dump
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        & "C:\Program Files\7-Zip\7z.exe" x -y "Dump20260529 (1).rar" -o"dump"

    - name: Initialize and seed a fresh MySQL data directory
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $mysql = "mysql-extracted/mysql-$env:MySqlVersion-winx64"
        & "$mysql/bin/mysqld.exe" --initialize-insecure --datadir="$mysql/data"
        Start-Process -FilePath "$mysql/bin/mysqld.exe" -ArgumentList "--datadir=$mysql/data --port=3308"
        Start-Sleep -Seconds 8
        Get-Content "dump/Dump20260529 (1).sql" -Raw | & "$mysql/bin/mysql.exe" -h 127.0.0.1 -P 3308 -u root
        & "$mysql/bin/mysqladmin.exe" -h 127.0.0.1 -P 3308 -u root shutdown
        Start-Sleep -Seconds 3

    - name: Trim and assemble the bundled MySQL folder
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        $mysql = "mysql-extracted/mysql-$env:MySqlVersion-winx64"
        New-Item -ItemType Directory -Force -Path dist/mysql/bin, dist/mysql/data, dist/mysql/share, dist/mysql/lib/plugin | Out-Null
        Copy-Item "$mysql/bin/*" dist/mysql/bin -Recurse -Force
        Get-ChildItem dist/mysql/bin -Include *.pdb,*.lib,*-debug.dll -Recurse | Remove-Item -Force
        Copy-Item "$mysql/data/*" dist/mysql/data -Recurse -Force
        Copy-Item "$mysql/share/*" dist/mysql/share -Recurse -Force
        Copy-Item "$mysql/lib/plugin/component_reference_cache.dll" dist/mysql/lib/plugin/

    - name: Install Inno Setup
      if: startsWith(github.ref, 'refs/tags/')
      run: choco install innosetup -y

    - name: Build the installer
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:GITHUB_REF_NAME installer.iss

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist-installer/BibliotecaCEITI-Setup.exe
